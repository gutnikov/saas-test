name: runtime-eol

# The entry of the maintenance super-loop: fails when a runtime of the project is past its end of life, or within 90
# days of it (loops/runtime-eol). A failed scheduled run reaches the owner.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-eol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: loops/runtime-eol/collect . "$RUNNER_TEMP/eol" && loops/runtime-eol/run "$RUNNER_TEMP/eol"
