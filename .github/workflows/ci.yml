name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The gates below run as the base branch has them (a worktree at .gate), so the pull request they judge cannot weaken
# them. A gate that a pull request brings for the first time runs from that pull request, with a warning to review it.

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make ci

  # The gate of the delivery super-loop: the spec stays whole, and every approved requirement went from red to green
  # with the spec and the acceptance tests as they were approved.
  acceptance:
    runs-on: ubuntu-latest
    env:
      SPEC_PLUGIN: ${{ github.workspace }}/.tools/my-claude-plugins/plugins/spec
      BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: gutnikov/my-claude-plugins
          ref: 0e3c71d320188d97a5d05b325e92a2a9a645e3c0 # spec 0.3.1
          path: .tools/my-claude-plugins
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      - name: take the gates from the base
        run: git worktree add --detach .gate "$BASE"
      - name: spec-check
        run: |
          G=.gate; [ -x .gate/loops/spec-check/run ] || { echo "::warning::spec-check comes from this pull request: review loops/ by hand"; G=.; }
          "$G/loops/spec-check/run" .
      - name: acceptance gate
        run: |
          G=.gate; [ -x .gate/loops/acceptance/run ] || { echo "::warning::the acceptance gate comes from this pull request: review loops/ by hand"; G=.; }
          "$G/loops/acceptance/collect" . "$RUNNER_TEMP/acceptance" && "$G/loops/acceptance/run" "$RUNNER_TEMP/acceptance"

  # The gate of the maintenance super-loop, for a pull request from a maint/ branch: no test, spec or expected value
  # changed, and the measure improved (loops/behaviour-invariance).
  maintenance:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'maint/')
    runs-on: ubuntu-latest
    env:
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: take the gate from the base
        run: git worktree add --detach .gate "$BASE"
      - name: behaviour invariance
        run: |
          G=.gate; [ -x .gate/loops/behaviour-invariance/run ] || { echo "::warning::behaviour-invariance comes from this pull request: review loops/ by hand"; G=.; }
          "$G/loops/behaviour-invariance/collect" . "$BASE" "$RUNNER_TEMP/invariance" && "$G/loops/behaviour-invariance/run" "$RUNNER_TEMP/invariance"
